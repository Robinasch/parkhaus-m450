; Pico 1 – Kasse
[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
test_ignore = *

; Automatische Unit-Tests für Tarif und Kennzeichen auf dem PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
